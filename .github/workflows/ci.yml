name: CI

on:
  push:
    branches: [ main, next ]
  pull_request:
    branches: [ main, next ]

jobs:
  test:
    name: Test on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, macos-latest ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y zsh git curl

      - name: Install dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install zsh git curl || true

      - name: Run test suite
        run: zsh tests/run.zsh

  # Run in containers via `docker run`: JavaScript actions such as checkout do not
  # work inside musl-based (Alpine) job containers.
  test-container:
    name: Test on ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: busybox (Alpine)
            image: alpine:latest
            setup: apk add --no-cache zsh git
          - name: zsh 5.1 (minimum supported)
            image: zshusers/zsh:5.1.1
            setup: 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Run test suite
        run: |
          docker run --rm -v "$PWD:/src:ro" "${{ matrix.image }}" sh -c \
            '${{ matrix.setup }} && cp -r /src /work && cd /work && zsh tests/run.zsh'
